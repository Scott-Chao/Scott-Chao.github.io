name: Publish reviewed website to GitHub Pages

# Publish verified changes pushed to main; manual runs remain available.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Check formatting
        run: pnpm format:check
      - name: Check Astro and TypeScript
        run: pnpm check
      - name: Build static pages
        run: pnpm build
      - name: Check content approval and root hosting
        run: pnpm check:launch
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production pages
        run: pnpm test:browser
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
